<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Blocked | ScamON AI Protection</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <div class="cyber-container">

      <div class="logo-shield">🚫</div>
      <h1>Website Blocked</h1>
      <p class="subtitle">Protected by ScamON AI</p>

    <div class="info-card">

        <span class="label">Website:</span>
        <span class="value" id="blocked-domain">unknown.com</span>

      <div class="info-row">
        <span class="label">Reason:</span>

      </div>
      <div class="info-row">
        <span class="label">Risk Score:</span>
        <span class="value score-pill" id="blocked-score">95%</span>
      </div>
      <div class="info-row">
        <span class="label">Blocked Time:</span>
        <span class="value" id="blocked-time">-</span>
      </div>
    </div>

    <div class="footer">
      <div class="safe-badge">✓ Safe Browsing Enabled</div>
      <p class="disclaimer">This website has been identified as high-risk by ScamON AI and blocked automatically to protect your privacy and system assets.</p>
    </div>
  </div>
  <script src="blocked.js"></script>
